# ============================================================================
# VUMA — Lean↔Rust Parity Gate
# ============================================================================
# This is the CI gate that finally BINDS the Lean↔Rust bridge.
#
# Prior waves (Round 7, Wave 0-D) verified that NO existing CI workflow
# enforces Lean↔Rust parity: `ci.yml` runs `lake build` and `cargo test` as
# *parallel siblings* — no `needs:` edge ever targets a Lean job, and the
# release workflow is not gated on Lean. A passing Rust build therefore
# never implied a passing Lean build, and vice-versa. An extraction drift
# between the Lean PMT library and the Rust runtime verifiers could land
# unnoticed.
#
# This workflow closes that gap with a strict serial `needs:` chain:
#
#   lean_build ─▶ cargo_check ─┬▶ smoke_test ─────────┐
#                             ├▶ e2e_test ────────────┤
#                             └▶ extraction_diff ─────┤
#                                                      ▼
#                                            master_harness
#
# `cargo_check` (and every downstream cargo job) CANNOT START until `lake
# build` is green. The `pmt-runtime-check` feature activates `build.rs`,
# which — when `lake` is on PATH and `LEAN_HOME` is set — attempts the real
# `lake build` → `lean --emit-c` → `cc::Build` FFI pipeline (build.rs:112 ff.).
# Setting `LEAN_HOME` here is what arms that gate rather than letting it
# silently fall through to the stub. So the parity check begins at compile
# time, not just at test time.
#
# Toolchain pins (must match repo pins exactly):
#   - Lean : proof/lean-toolchain  → leanprover/lean4:v4.21.0
#   - Rust : rust-toolchain.toml   → nightly-2026-03-01
#
# Triggers: push/PR to `main` (permanent) and to `cleanup-attack` (temporary,
# for this attack wave — remove the `cleanup-attack` entries once the gate
# is merged to main and verified green).
# ============================================================================

name: Lean-Rust Parity

on:
  push:
    branches: [main, cleanup-attack]
  pull_request:
    branches: [main, cleanup-attack]

# Cancel in-flight runs when a new commit lands on the same branch/PR.
# Keeps the (intentionally serial) chain from piling up.
concurrency:
  group: lean-rust-parity-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # `LEAN_HOME` is exported per-job (in the "Setup LEAN_HOME" step, after
  # elan installs the toolchain) to the elan root so build.rs's linkage
  # gate (build.rs:120 — `env::var_os("LEAN_HOME").is_some()`) sees a
  # populated value pointing at the real Lean install. We cannot set it
  # here at the workflow level because `$HOME` is not resolvable in the
  # `env:` context; the per-job `$GITHUB_ENV` write is the robust path.

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:

  # ── lean_build ────────────────────────────────────────────────────────────
  # Head of the chain. Builds the Lean PMT library + `check-pmt` / `test`
  # exes (proof/lakefile.toml). MUST pass before any Rust job starts.
  lean_build:
    name: Lean Build (lake build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain)
        uses: oravirt/elan-action@v2
        with:
          lean-version: leanprover/lean4:v4.21.0

      - name: Setup LEAN_HOME
        run: echo "LEAN_HOME=$HOME/.elan" >> "$GITHUB_ENV"

      - name: "Verify Lean version (pin: v4.21.0)"
        run: lean --version

      - name: Build Lean proofs (cd proof && lake build)
        run: cd proof && lake build 2>&1 | tee lake-build.log

      - name: Upload lake build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-logs
          path: proof/lake-build.log
          if-no-files-found: warn
          retention-days: 7

  # ── cargo_check ───────────────────────────────────────────────────────────
  # First Rust-side step. `--features pmt-runtime-check` activates build.rs,
  # which (because LEAN_HOME is set + lake is on PATH) attempts the real
  # Lean→C extraction + linkage pipeline. A drift in the extracted symbols
  # vs. the Rust FFI declarations surfaces here as a compile error.
  cargo_check:
    name: Cargo Check (pmt-runtime-check)
    needs: lean_build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain)
        uses: oravirt/elan-action@v2
        with:
          lean-version: leanprover/lean4:v4.21.0

      - name: Setup LEAN_HOME
        run: echo "LEAN_HOME=$HOME/.elan" >> "$GITHUB_ENV"

      - name: "Install Rust toolchain (pin: nightly-2026-03-01)"
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: rust-src

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: parity-cargo-check-${{ runner.os }}

      - name: cargo check --features pmt-runtime-check
        run: cargo check --features pmt-runtime-check 2>&1 | tee cargo-check.log

      - name: Upload cargo check output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-logs
          path: cargo-check.log
          if-no-files-found: warn
          retention-days: 7

  # ── smoke_test ────────────────────────────────────────────────────────────
  # FFI smoke test. `--ignored` because the smoke harness is tagged
  # `#[ignore]` (slow / requires real Lean linkage). Verifies the 7 Lean
  # export symbols are callable through the Rust FFI shim.
  smoke_test:
    name: Smoke Test (pmt_runtime_ffi_smoke --ignored)
    needs: cargo_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain)
        uses: oravirt/elan-action@v2
        with:
          lean-version: leanprover/lean4:v4.21.0

      - name: Setup LEAN_HOME
        run: echo "LEAN_HOME=$HOME/.elan" >> "$GITHUB_ENV"

      - name: "Install Rust toolchain (pin: nightly-2026-03-01)"
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: rust-src

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: parity-smoke-${{ runner.os }}

      - name: cargo test pmt_runtime_ffi_smoke (--ignored)
        run: cargo test --features pmt-runtime-check --test pmt_runtime_ffi_smoke -- --ignored 2>&1 | tee smoke-test.log

      - name: Upload smoke test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: smoke-test.log
          if-no-files-found: warn
          retention-days: 7

  # ── e2e_test ──────────────────────────────────────────────────────────────
  # End-to-end feature-flag test: toggles `pmt-runtime-check` paths and
  # confirms runtime behaviour matches the Lean-verified invariants.
  e2e_test:
    name: E2E Test (pmt_feature_flag_test)
    needs: cargo_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain)
        uses: oravirt/elan-action@v2
        with:
          lean-version: leanprover/lean4:v4.21.0

      - name: Setup LEAN_HOME
        run: echo "LEAN_HOME=$HOME/.elan" >> "$GITHUB_ENV"

      - name: "Install Rust toolchain (pin: nightly-2026-03-01)"
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: rust-src

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: parity-e2e-${{ runner.os }}

      - name: cargo test pmt_feature_flag_test
        run: cargo test --features pmt-runtime-check --test pmt_feature_flag_test 2>&1 | tee e2e-test.log

      - name: Upload e2e test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: e2e-test.log
          if-no-files-found: warn
          retention-days: 7

  # ── extraction_diff ───────────────────────────────────────────────────────
  # Extraction-diff test: compares the extracted Lean C output against the
  # committed Rust FFI expectations and fails on any semantic drift.
  extraction_diff:
    name: Extraction Diff (pmt_extraction_diff)
    needs: cargo_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain)
        uses: oravirt/elan-action@v2
        with:
          lean-version: leanprover/lean4:v4.21.0

      - name: Setup LEAN_HOME
        run: echo "LEAN_HOME=$HOME/.elan" >> "$GITHUB_ENV"

      - name: "Install Rust toolchain (pin: nightly-2026-03-01)"
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: rust-src

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: parity-extraction-diff-${{ runner.os }}

      - name: cargo test pmt_extraction_diff
        run: cargo test --features pmt-runtime-check --test pmt_extraction_diff 2>&1 | tee extraction-diff.log

      - name: Upload extraction diff output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-diff-logs
          path: extraction-diff.log
          if-no-files-found: warn
          retention-days: 7

  # ── master_harness ────────────────────────────────────────────────────────
  # Full parity harness. `--include-ignored` runs the heavy/ignored cases
  # in `pmt_parity_test_full.rs`. This is the terminal gate: it only runs
  # once both the smoke and e2e arms are green, so a failure here means a
  # genuine parity regression surfaced after the cheaper gates passed.
  # Allow ~5 min runtime (timeout at 8 min for headroom).
  master_harness:
    name: Master Parity Harness (pmt_parity_test_full)
    needs: [smoke_test, e2e_test]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain)
        uses: oravirt/elan-action@v2
        with:
          lean-version: leanprover/lean4:v4.21.0

      - name: Setup LEAN_HOME
        run: echo "LEAN_HOME=$HOME/.elan" >> "$GITHUB_ENV"

      - name: "Install Rust toolchain (pin: nightly-2026-03-01)"
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: rust-src

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: parity-master-harness-${{ runner.os }}

      - name: cargo test pmt_parity_test_full (--include-ignored)
        run: cargo test --features pmt-runtime-check --test pmt_parity_test_full -- --include-ignored 2>&1 | tee master-harness.log

      - name: Upload master harness output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: master-harness-logs
          path: master-harness.log
          if-no-files-found: warn
          retention-days: 7
