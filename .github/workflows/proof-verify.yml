# ============================================================================
# VUMA — Proof-Verify CI
# ============================================================================
# Dedicated CI job for the proof-logging / `bv_verify` gate pipeline.
#
# This workflow exists to satisfy the CI requirement (referenced in the
# test comment at `src/codegen/src/bv_verify.rs:429` — `test_wave36_unsound_rule_rejected`).
# It runs the full set of proof-related unit tests across the workspace so a
# regression in:
#
#   * `bv_verify`                  — bitvector soundness gate
#   * `proof_artifacts`            — `check_proof_log` post-saturation audit
#   * any `proof_log`-named test   — broader proof-system wiring
#
# is surfaced on every push to `main` and every PR targeting `main`, even if
# the broader `ci.yml` test matrix is skipped or its cache is stale.
#
# Test selector: `cargo test --workspace -- bv_verify proof_artifacts proof_log`
# runs every test whose name (or path) contains one of those substrings.
# Currently this exercises:
#   - vuma-codegen: `bv_verify::tests::*` (7 tests, incl. the unsound-rule gate test)
#   - vuma-codegen: `proof_artifacts::tests::*` (4 tests, incl. `test_wave36_saturate_with_proof_then_check`)
#   - vuma-codegen: `egraph::tests::test_wave36_*` (2 tests)
#   - vuma-proof / vuma-ive: any `proof_log`-named tests that exist across the workspace
#
# Style mirrors `.github/workflows/ci.yml` (same `dtolnay/rust-toolchain@stable`
# action with `toolchain: nightly-2026-03-01`, same `Swatinem/rust-cache@v2`
# caching, same env vars).
# ============================================================================

name: Proof Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight jobs when a new commit lands on the same branch/PR.
concurrency:
  group: proof-verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  proof-verify:
    name: Proof-verify (bv_verify + check_proof_log)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: rust-src

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: proof-verify-${{ runner.os }}

      # Gate smoke-check: build the workspace so any compile-level
      # regression in the proof/bv_verify modules is caught here rather than
      # only at test time.
      - name: Build workspace
        run: cargo build --workspace

      # Proof tests. The trailing positional args are test-name
      # substrings — cargo runs any test whose full path contains at least
      # one of them. `--no-fail-fast` keeps the run going after a single
      # failure so all regressions are surfaced in one log.
      - name: Run proof / bv_verify / proof_log tests
        run: cargo test --workspace --no-fail-fast -- bv_verify proof_artifacts proof_log

  # ==========================================================================
  # Lean 4 proofs (lake build + sorry check)
  # ==========================================================================
  # Parallel Lean-side gate, sibling of `proof-verify` above. Runs `lake
  # build` against the `proof/` Lake package (multi-module PMT library +
  # `check-pmt` exe + `test` exe, as declared in `proof/lakefile.toml`)
  # and then invokes `scripts/check-lean.sh` to detect any `sorry` tokens
  # in the build output. This is the Lean counterpart to the Rust-side
  # `proof-verify` job — both run in parallel on every push/PR to `main`.
  #
  # Toolchain pin: `proof/lean-toolchain` declares `leanprover/lean4:v4.21.0`,
  # mirrored below in the `lean-version` input to `elan-action` so the
  # installed toolchain matches the project pin exactly.
  #
  # Strict by default: the PMT proof library is sorry-free.
  # `PROOF_CHECK_STRICT=1` causes `scripts/check-lean.sh` to fail CI on any
  # `sorry` token surfaced by `lake build`.
  # ==========================================================================
  lean-proofs:
    name: Lean 4 Proofs (lake build + sorry check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain)
        uses: oravirt/elan-action@v2
        with:
          lean-version: leanprover/lean4:v4.21.0

      - name: Verify Lean version
        run: lean --version

      - name: Build Lean proofs
        run: cd proof && lake build

      - name: Check for sorry (strict)
        env:
          # Strict mode (fail on any sorry) is enabled — the
          # PMT proof library is sorry-free.
          PROOF_CHECK_STRICT: "1"
        run: ./scripts/check-lean.sh

      - name: Run Lean tests
        run: cd proof && lake exe test
