# ============================================================================
# VUMA CI Pipeline
# ============================================================================
# Runs on every push to main and on pull requests targeting main.
# Jobs: build, manifest, test (matrix), fmt, clippy, docs, lean-proofs, qemu-smoke
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight jobs when a new commit lands on the same branch/PR.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: rust-src

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ runner.os }}

      - name: Build workspace
        run: cargo build --workspace --verbose

  # ── Manifest reconciliation ───────────────────────────────────────────────
  # Verifies that tests/gold_standard/manifest.json (the canonical source of
  # truth for the gold-standard test suite) matches the .vuma files actually
  # present on disk. Drift fails the build. See Task 9-b / caveats.md §6 row 1.
  manifest:
    name: Gold-standard manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify manifest matches filesystem
        run: make verify-manifest

  # ── Test ───────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # macOS-latest runners are Apple Silicon (aarch64), giving us
          # native ARM64 test coverage without cross-compilation.
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: rust-src
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ runner.os }}-${{ matrix.target }}

      - name: Run tests
        run: cargo test --workspace --verbose

  # ── Fmt ────────────────────────────────────────────────────────────────────
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Clippy ─────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: clippy, rust-src

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ runner.os }}

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

  # ── Docs ───────────────────────────────────────────────────────────────────
  docs:
    name: Documentation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: rust-src

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: docs-${{ runner.os }}

      - name: Build documentation
        run: cargo doc --workspace --no-deps

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: vuma-docs
          path: target/doc
          retention-days: 7

  # ── Lean Proofs ─────────────────────────────────────────────────────────────
  # Builds and tests the Lean proof package under ./proof. Runs in parallel
  # with the FAST Rust test jobs (no `needs:` dependency) so Lean failures
  # don't block Rust developer feedback and vice versa. Strict sorry check is
  # enabled (PMT proof library is sorry-free).
  #
  # ── Release gating policy (Wave 7-B) ───────────────────────────────────────
  # Policy: "Fast Rust test jobs run in parallel for developer feedback.
  #          Release/publish jobs gate on lean-rust-parity workflow success."
  #
  # This ci.yml defines NO release/publish/deploy job — every job here is a
  # fast-feedback check and stays parallel (none of build/test/fmt/clippy/
  # docs/qemu-smoke `needs:` a Lean job, by design). The release/publish jobs
  # live in release.yml (triggered on `v*` tags) and are the ONLY jobs that
  # must gate on Lean parity. That gate is enforced cross-workflow because the
  # `lean-rust-parity` check runs in its own workflow file (Wave 7-A):
  #   release.yml's `release` job should require the lean-rust-parity workflow
  #   to have succeeded — either via a `workflow_run` trigger that waits on
  #   `lean-rust-parity` completing with `success`, OR by a downstream
  #   `needs:`-style check job that re-runs/queries it. It is intentionally NOT
  #   wired as a plain `needs:` here because (a) ci.yml has no release job to
  #   attach it to and (b) lean-rust-parity is a separate workflow, so a same-
  #   workflow `needs:` is not available — `workflow_run` is the GitHub-mandated
  #   cross-workflow gate. Until release.yml is updated, this comment is the
  #   authoritative record of the policy; see NEEDS_FOLLOWUP 7-B.
  lean-proofs:
    name: Lean Proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.21.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build proofs
        run: cd proof && lake build

      - name: Check sorry (strict)
        env:
          # Strict mode (fail on any sorry) is enabled — the
          # PMT proof library is sorry-free.
          PROOF_CHECK_STRICT: "1"
        run: ./scripts/check-lean.sh

      - name: Run proof tests
        run: cd proof && lake exe test

  # ── QEMU smoke test ─────────────────────────────────────────────────────────
  # Builds the compiler, then for each of the 12 QEMU backends + wasm32
  # (wasmtime) compiles 4 gold-standard .vuma programs and runs them under
  # the appropriate emulator, checking the process exit code against the
  # `// Expected exit code:` header in each test file. See
  # scripts/qemu_smoke_test.sh for details.
  qemu-smoke:
    name: QEMU smoke test (12 ISAs + wasm32)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: rust-src

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: qemu-smoke-${{ runner.os }}

      - name: Install qemu-user-static (all 12 ISAs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
          # Sanity-check the 12 emulators we exercise are on PATH.
          for isa in aarch64 x86_64 riscv64 s390x arm ppc64 m68k sparc64 hppa alpha loongarch64 mips64el; do
            command -v qemu-${isa}-static >/dev/null || { echo "missing qemu-${isa}-static"; exit 1; }
          done

      - name: Install wasmtime (wasm32 backend)
        run: |
          curl -sSfL https://wasmtime.dev/install.sh | bash -s -- --version 47.0.2
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Run QEMU smoke-test matrix
        run: make qemu-smoke

      - name: Upload smoke-test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-smoke-log
          path: |
            target/release/vuma
          retention-days: 7
