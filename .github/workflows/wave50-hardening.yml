# ============================================================================
# VUMA Wave 50 — Final Hardening CI
# ============================================================================
# Wave 50 hardening jobs (Task 6-d reconciled the advisory/strict split):
#   * clippy-advisory  — runs `cargo clippy --workspace`, fails only on
#                        clippy ERRORS (not warnings).  Advisory only —
#                        the codebase currently has ~658 pre-existing
#                        clippy warnings (mostly in vuma-codegen); the
#                        pre-existing `.github/workflows/ci.yml:124` job
#                        `cargo clippy --workspace -- -D warnings` (added
#                        in Wave 11) is the strict gate.  This job provides
#                        additional clippy coverage (with `--all-targets`)
#                        without enforcing.  Once the warning count trends
#                        to zero, this job should switch to `-D warnings`
#                        (matching ci.yml) and the `clippy-advisory` name
#                        should drop the `-advisory` suffix.
#   * full-test-strict — runs `cargo test --workspace --no-fail-fast`,
#                        STRICT (blocking).  Upgraded from
#                        `continue-on-error: true` (advisory) to strict in
#                        Task 6-d: the pre-existing `.github/workflows/ci.yml`
#                        test job (line 84, `cargo test --workspace --verbose`)
#                        has been the strict gate since Wave 11, and the
#                        codebase test suite is now green enough that
#                        Wave 50's own job no longer needs to be advisory.
#                        `--no-fail-fast` is retained so that all failures
#                        in a single run are surfaced, not just the first.
#
# These jobs are SEPARATE from `.github/workflows/ci.yml` (which has
# `-D warnings` clippy and a per-OS `cargo test --workspace` test job)
# so that the existing gating jobs are unaffected.  Wave 50 introduces
# these jobs to surface additional clippy coverage (with --all-targets)
# and a redundant strict test gate on every push.
# ============================================================================

name: Wave 50 Hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: wave50-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # ── Clippy (advisory — fails on errors only) ──────────────────────────────
  clippy-advisory:
    name: Clippy (advisory, errors-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: clippy, rust-src

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: wave50-clippy-${{ runner.os }}

      - name: Run Clippy (advisory)
        # Advisory only — pre-existing ci.yml (line 124) enforces strict
        # clippy with `-D warnings`; this job provides additional clippy
        # coverage (with `--all-targets`) without enforcing.
        #
        # As of Task 6-d the codebase has ~658 pre-existing clippy
        # warnings (mostly in vuma-codegen) — too many to fix in a single
        # bounded task.  Once the warning count trends to zero, replace
        # this with `cargo clippy --workspace --all-targets -- -D warnings`
        # (matching the existing ci.yml clippy job) and rename the job to
        # drop the `-advisory` suffix.
        #
        # In the meantime, fail only on clippy ERRORS (lines starting
        # with "error"), not on warnings.
        run: |
          set +e
          cargo clippy --workspace --all-targets 2>&1 | tee clippy.log
          # If clippy emitted any "error:" lines (excluding "error: could
          # not compile" which is a downstream summary), fail the job.
          if grep -E '^error' clippy.log | grep -v 'could not compile' | grep -q . ; then
            echo "::error::Clippy emitted errors — see clippy.log"
            exit 1
          fi
          # Warnings are tolerated (advisory).
          echo "Clippy passed (warnings tolerated, errors blocked)."
          exit 0

  # ── Full test suite (strict — blocking) ───────────────────────────────────
  full-test-strict:
    name: Full test suite (strict)
    runs-on: ubuntu-latest
    # STRICT (blocking).  Upgraded from `continue-on-error: true` (advisory)
    # in Task 6-d: the pre-existing `.github/workflows/ci.yml` test job
    # (line 84) has been the strict gate since Wave 11, and the Wave 50
    # test suite is now green enough that this job no longer needs to be
    # advisory.  Verified locally with:
    #   * `cargo check --workspace`: 0 errors
    #   * `cargo test -p vuma-tests --lib wave50`: 9 passed, 0 failed
    #   * `cargo test -p vuma-codegen --lib memory_safety`: 16 passed, 0 failed
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: rust-src

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: wave50-test-${{ runner.os }}

      - name: Run full test suite (--no-fail-fast)
        # --no-fail-fast keeps the suite running after a failure so that
        # all failures are surfaced in a single run, not just the first.
        # This job is now STRICT (blocking) per Task 6-d.
        run: cargo test --workspace --no-fail-fast
