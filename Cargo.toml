[package]
name = "vuma"
version = "0.2.0-alpha.1"
edition = "2021"
description.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
rust-version = "1.75"

[workspace]
members = [
    "src/scg",
    "src/ive",
    "src/vuma",
    "src/bd",
    "src/cor",
    "src/parser",
    "src/codegen",
    "src/std",
    "src/proof",
    "src/tests",
    "src/package",
]

[workspace.package]
version = "0.2.0-alpha.1"
description = "Verified-Unsafe Memory Access — a programming language framework with behavioral verification, 10-architecture codegen, and LLM integration"
repository = "https://github.com/pkhairkh/vuma"
license = "MIT"
keywords = ["compiler", "verification", "memory-safety", "codegen", "ai-native"]
categories = ["compilers", "development-tools", "memory-management"]
authors = ["Parham Khairkhah"]
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
# Internal crates
vuma-scg = { path = "src/scg" }
vuma-ive = { path = "src/ive" }
vuma-core = { path = "src/vuma" }
vuma-bd = { path = "src/bd" }
vuma-codegen = { path = "src/codegen" }
vuma-parser = { path = "src/parser" }
vuma-cor = { path = "src/cor" }
vuma-proof = { path = "src/proof" }
vuma-package = { path = "src/package" }
# External crates — pinned
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = { version = "0.4", features = ["std"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
indexmap = "2"
smallvec = "1"
hashbrown = { version = "0.14", features = ["serde"] }
toml = "0.8"
libc = "0.2"
tempfile = "3"
proptest = "1"
rayon = "1"

[workspace.metadata]
release = "alpha"
release-channel = "pre-release"
min-rust-version = "1.75"
msrv-policy = "latest-stable"
homepage = "https://github.com/pkhairkh/vuma"
documentation = "https://github.com/pkhairkh/vuma/tree/main/docs"
bug-tracker = "https://github.com/pkhairkh/vuma/issues"
changelog = "https://github.com/pkhairkh/vuma/blob/main/CHANGELOG.md"
license-file = "LICENSE"

[dependencies]
vuma-scg.workspace = true
vuma-ive.workspace = true
vuma-core.workspace = true
vuma-bd.workspace = true
vuma-codegen.workspace = true
vuma-parser.workspace = true
vuma-cor.workspace = true
vuma-proof.workspace = true
vuma-package.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
clap.workspace = true
chrono.workspace = true
indexmap.workspace = true
smallvec.workspace = true
hashbrown.workspace = true
toml.workspace = true
rayon.workspace = true

[build-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Fast iterative build profile for test-suite runs.
# Disables LTO and bumps codegen-units so a from-scratch build that
# would take 10+ minutes on a Pi 5 with the `release` profile completes
# in ~1-2 minutes. Runtime is still O3 (so QEMU-emulated executions stay
# fast); only the link-time optimization pass is skipped, which costs
# ~5-10% runtime but ~5-10x build time.
#
# Use:  cargo build --profile release-fast --bin compile_dump --bin dump_ir
# The binary lands in target/release-fast/ (NOT target/release/).
[profile.release-fast]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
debug = false
strip = true

