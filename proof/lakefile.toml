# Lake build configuration for VUMA's Lean 4 proofs.
#
# This file is the entry point for `lake build` from within `proof/`.
# It declares a single Lean library `PMT` rooted at `PMT.lean`, which
# re-exports the multi-module layout:
#   PMT/Basic.lean          (§1-§2: Arena, Field, Layout, CapacityInvariant)
#   PMT/Field.lean          (§3-§4: FieldBounds, Linearity, LinearResource)
#   PMT/Liveness.lean       (§5-§6: Liveness predicate, GuardPage)
#   PMT/Soundness.lean      (§7:   Execution model, pmt_soundness theorem)
#   PMT/Faithful/*.lean     (faithful model: USize, Ptr, Arena, simulation)
# and the test harness modules under `PMT/Test/`:
#   PMT/Test/ValidProgram.lean      (W7-A: valid 2-step happy path)
#   PMT/Test/UafProgram.lean        (W7-B: UAF trap detection)
#   PMT/Test/OverflowProgram.lean   (W7-C: arena overflow trap)
#   PMT/Test/EmptyProgram.lean      (W7-D: empty-program nil case)
#   PMT/Test/MultiStepProgram.lean  (W7-E: multi-step capacity preservation)
# The `test` executable (`lake exe test`) imports all test modules and
# prints a success banner — invoked by `just proof-test`.
#
# Run: `cd proof && lake build`  (builds PMT lib + check-pmt + test exe)
# Run: `cd proof && lake exe test`  (runs the test harness)

name = "vuma-proof"
version = "0.1.0"
keywords = ["vuma", "pmt", "memory-safety", "formal-verification"]

# Build the `PMT` library and the `check-pmt` executable by default
# when running bare `lake build` (Lake 5.x requires explicit
# `defaultTargets` — otherwise `lake build` is a no-op).
# The `test` exe is NOT a default target (it's invoked on-demand by
# `just proof-test` / `lake exe test`) so `lake build` stays focused on
# the proof library + check-pmt.
defaultTargets = ["PMT", "check-pmt"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

# stdlib is implicit in Lean 4 — no `[[require]]` block needed.

[[lean_lib]]
name = "PMT"
# Root module is `PMT.lean` which imports all submodules:
#   PMT.Basic, PMT.Field, PMT.Liveness, PMT.Soundness,
#   PMT.Faithful.* (merged from the former Pmt/ directory),
#   PMT.Test.*

[[lean_exe]]
name = "check-pmt"
root = "check_pmt"

[[lean_exe]]
name = "test"
root = "Test.Main"
