[dependencies]
# serde/serde_json removed in Wave 43 — all SCG types (NodeData, EdgeData,
# SCGRegion + cascade NodeId/NodeType/NodePayload/EdgeKind/RegionId/...)
# now rely on hand-written Debug + Clone derives only. Binary serialization
# goes through `src/scg/src/serialize.rs` BinaryReader/BinaryWriter. The
# LLM-facing JSON output (`SCG::to_json`, `SCGDiff::to_json`) is now
# produced by a hand-written JSON serializer in `src/scg/src/llm_json.rs`
# (replacing `serde_json::to_string_pretty`); the on-disk JSON shape is
# byte-identical. Round-trip tests that previously used
# `serde_json::from_str::<LlmScgJson>` now use `LlmScgJson::from_json_str`
# (hand-written parser in `src/scg/src/llm_json.rs`).
