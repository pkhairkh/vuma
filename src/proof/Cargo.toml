[package]
name = "vuma-proof"
version.workspace = true
edition.workspace = true
description = "VUMA Proof System — formal proof checker, tactics, counterexample generation, and composition"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# serde/serde_json removed in Wave 43 — all proof types (Proof, Judgment,
# Fact, ProofStep + cascade ProofContext/Goal/CleanupProof/NoDoubleFreeProof/
# NoUseAfterFreeProof/NoAliasProof/SynchronizationProof/ExclusivitySubProof/
# ExclusivityProof/OriginProof/DerivationChainProof/TaintProof/
# BDCompatibilityProof/ReinterpretationSafetyProof/InterpretationProof/
# NoDeadlockProof/AllocationFreedProof/LivenessProof/ProofBundle/
# InvariantName/ProofKind/etc.) now rely on hand-written Debug + Clone
# derives only. Binary serialization goes through `src/proof/src/serialization.rs`
# BinaryWrite/BinaryRead + serialize_proof/deserialize_proof (added in Wave 43).
# The `#[serde(rename_all = "snake_case")]` attribute on `InvariantName` was
# removed; the existing `Display` impl produces the same snake_case names
# ("liveness", "exclusivity", "cleanup", "origin", "interpretation"), so any
# JSON-style string output is unchanged. The `ProofEnvelope` JSON path was
# removed in Wave 43 along with the `SerializationError` wrapper.
vuma-scg = { path = "../scg" }
