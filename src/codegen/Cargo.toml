[package]
name = "vuma-codegen"
version.workspace = true
edition.workspace = true
description = "VUMA Codegen — 8-architecture backend (x86_64, AArch64, RISC-V 64, ARM32, MIPS64, PPC64, LoongArch64, Wasm32)"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
vuma-scg.workspace = true
# serde/serde_json removed — all codegen IR/regalloc/backend types
# now rely on hand-written Debug + Clone derives only. The single JSON call
# site (`ProfileData::from_json` in `src/codegen/src/egraph.rs`) was migrated
# to a hand-written recursive descent parser (`parse_profile_json`) that
# understands the shape `{"hotness": {"<id>": <u64>, ...}}` — the on-disk
# JSON format produced by `ProfileData::to_json` is unchanged.

[features]
# pmt-runtime-check: when enabled, compiles the verified Lean-translated PMT
# checkers from proof/extracted/pmt_check.rs into the runtime. The checkers
# are NOT yet wired into arena.rs (future wave); this flag only gates module
# compilation so downstream work can opt-in incrementally.
pmt-runtime-check = []
