[package]
name = "vuma-codegen"
version.workspace = true
edition.workspace = true
description = "VUMA Codegen — 8-architecture backend (x86_64, AArch64, RISC-V 64, ARM32, MIPS64, PPC64, LoongArch64, Wasm32)"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
vuma-scg.workspace = true
# serde/serde_json removed — all codegen IR/regalloc/backend types
# now rely on hand-written Debug + Clone derives only. The single JSON call
# site (`ProfileData::from_json` in `src/codegen/src/egraph.rs`) was migrated
# to a hand-written recursive descent parser (`parse_profile_json`) that
# understands the shape `{"hotness": {"<id>": <u64>, ...}}` — the on-disk
# JSON format produced by `ProfileData::to_json` is unchanged.

[features]
default = []
# pmt-runtime-check: when enabled, compiles the verified Lean-translated PMT
# checkers (runtime/pmt_check.rs) and routes arena.rs::alloc_raw through
# `verified_capacity_check` instead of the hand-written overflow guard.
# The module is pure Rust (no `extern "C"` / no link-time deps), so it
# compiles cleanly under `cargo check -p vuma-codegen --features
# pmt-runtime-check` without the root build.rs C-archive linkage. `default
# = []` keeps the feature OFF by default (opt-in only).
pmt-runtime-check = []
