[package]
name = "vuma-core"
version.workspace = true
edition.workspace = true
description = "VUMA Core — memory model, MSG construction, invariant checking, and security analysis"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# serde/serde_json removed in Wave 43 — all vuma-core types (security/sync/
# address/access/derivation/region/program_point/msg/etc.) now rely on
# hand-written Debug + Clone derives only. The `:diagnostics` REPL command
# (`src/vuma/src/repl.rs`) previously used `serde_json::json!` +
# `serde_json::to_string_pretty`; it now uses `vuma_scg::llm_json` (the
# hand-written JSON value type + pretty-printer in `src/scg/src/llm_json.rs`).
# The on-disk JSON shape produced by `:diagnostics` is byte-identical.
vuma-scg.workspace = true
vuma-parser.workspace = true
vuma-ive.workspace = true
vuma-bd.workspace = true
vuma-cor.workspace = true
vuma-codegen.workspace = true
vuma-proof.workspace = true
