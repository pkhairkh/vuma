[package]
name = "vuma-package"
version.workspace = true
edition.workspace = true
description = "VUMA Package Manager — manifest parser, dependency resolver, local registry"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# serde/serde_json and the third-party `toml` crate were removed in Wave 43.
# `PackageManifest` and `RegistryIndex` now use the in-tree `toml_lite` module
# (`src/package/src/toml_lite.rs`) — a hand-written TOML parser/serializer that
# supports the subset of TOML used by `vuma.pkg` manifests and the registry
# `index.toml` file (sections, array-of-tables, key=value strings, arrays of
# strings). The on-disk TOML format is unchanged.
