[package]
name = "vuma-ive"
version.workspace = true
edition.workspace = true
description = "Inference & Verification Engine — behavioral descriptor inference and invariant verification"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
vuma-bd.workspace = true
vuma-scg.workspace = true
vuma-codegen.workspace = true
# Z3 SMT solver for contract discharge (Wave 1: real verification)
z3 = "0.20"
# serde/serde_json removed in Wave 43 — all IVE types now rely on hand-written
# Debug + Clone derives only; no JSON serialization is performed inside this
# crate.

[features]
default = []
# Activates the Lean↔Rust FFI routing in src/ive/src/verification.rs.
# When off (default), the IVE pipeline uses hand-written Rust verifiers.
# When on, the call site dispatches to verify_pmt_via_lean (stub or real
# Lean depending on the lean_ffi_linked cfg emitted by build.rs).
pmt-runtime-check = []
