[package]
name = "vuma-ive"
version.workspace = true
edition.workspace = true
description = "Inference & Verification Engine — behavioral descriptor inference and invariant verification"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
vuma-bd.workspace = true
vuma-scg.workspace = true
vuma-codegen.workspace = true
# Z3 SMT solver — HARD dependency for contract discharge.
# The "V" in VUMA depends on Z3. Install libz3-dev on the host:
#   Debian/Ubuntu: apt install libz3-dev
#   macOS: brew install z3
#   Arch: pacman -S z3
z3 = "0.20"

[features]
default = []
# pmt-runtime-check: retained as a no-op for IVE (Lean FFI bridge removed).
# Still has a real effect in vuma-codegen (activates pure-Rust pmt_check).
pmt-runtime-check = []
